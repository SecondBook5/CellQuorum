# Linux x86_64 / Python 3.12 / CUDA 12.9 workstation profile.
# RAPIDS uses the separate CUDA worker in rapids-worker-requirements.txt (envs/README.md).
# Install CellQuorum separately from its built wheel after creating this environment.
name: cellquorum-gpu
channels:
- conda-forge
- bioconda
dependencies:
- python=3.12
- pip
- git
- cython
- numpy=2.3.5
- scipy=1.16.3
- pandas=3.1.1
- scikit-learn>=1.4
- statsmodels>=0.14
- numba>=0.59
- anndata=0.13.4
# mudata (a scvi-tools and liana dependency) imports Settings from scverse-misc, which needs scverse-misc's
# `settings` extra: pydantic-settings and python-dotenv. A conda install of scverse-misc does not bring
# extras, so without these two `import mudata`, `import scvi` and `import liana` fail.
- pydantic-settings
# LIANA imports pooch when loading its orthology resources.
- pooch>=1.8,<2
- python-dotenv
- scanpy=1.12.5
- h5py>=3.10
- zarr>=2.17
- natsort>=8.4
- umap-learn=0.5.12
- pynndescent>=0.5
- python-igraph>=0.11
- leidenalg>=0.10
- louvain>=0.8
- petsc4py>=3.22
- slepc4py>=3.22
- harmonypy>=0.0.10
- bbknn>=1.6
- scrublet>=0.2
- decoupler-py=2.2.0
- networkx>=3.2
- joblib>=1.3
- tqdm>=4.66
- matplotlib>=3.8
- seaborn>=0.13
- jinja2>=3.1
- markdown>=3.6
- pyarrow>=14
- fastparquet>=2024.2
- openpyxl>=3.1
- pyyaml>=6.0
- hydra-core>=1.3
- omegaconf>=2.3
- pydantic>=2.7
- typer>=0.12
- rich>=13.0
- pip:
  - torch @ https://download-r2.pytorch.org/whl/cu129/torch-2.8.0%2Bcu129-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=02c7258e917f3043c978b53acf6f02b818db0d0d85db0e58ae578af333b9b4e2
  - pygpcca @ git+https://github.com/msmdev/pygpcca.git@773c463cc5043a5d40e6f31bbbc20f4e49587008
