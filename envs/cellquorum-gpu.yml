name: cellquorum-gpu

channels:
  - pytorch
  - nvidia
  - rapidsai
  - conda-forge
  - bioconda

dependencies:
  # Python runtime.
  - python=3.12
  - pip

  # Core CPU stack.
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - anndata
  - scanpy

  # GPU/deep-learning stack.
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch-cuda=12.1

  # RAPIDS stack.
  - cuda-version=12.1
  - cupy
  - cudf
  - cuml
  - cugraph

  # scRNA-seq deep generative models.
  - pip:
      - scvi-tools>=1.2
      - rapids-singlecell
      - -e .
