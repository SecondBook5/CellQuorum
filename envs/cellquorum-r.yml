name: cellquorum-r

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python runtime.
  - python=3.12
  - pip

  # R runtime and bridge.
  - r-base>=4.4
  - rpy2>=3.5

  # Core Python package dependencies needed to call CellQuorum adapters.
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.1
  - anndata>=0.11
  - scanpy>=1.10
  - pyyaml>=6.0
  - pydantic>=2.7
  - typer>=0.12
  - rich>=13.0

  # R package management.
  - r-remotes
  - r-devtools
  - r-optparse
  - r-jsonlite
  - r-yaml
  - r-data.table
  - r-dplyr
  - r-tibble
  - r-readr
  - r-ggplot2
  - r-patchwork

  # Bioconductor core.
  - bioconductor-biocgenerics
  - bioconductor-summarizedexperiment
  - bioconductor-singlecellexperiment
  - bioconductor-scater
  - bioconductor-scran
  - bioconductor-biocparallel

  # R/Bioconductor single-cell methods.
  - bioconductor-scdblfinder
  - bioconductor-batchelor
  - bioconductor-singleR
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-deseq2
  - bioconductor-complexheatmap

  # R regulatory/network methods.
  - bioconductor-aucell
  - bioconductor-genie3
  - bioconductor-dorothea
  - bioconductor-viper

  # DIALOGUE (multicellular_programs) CRAN dependencies. DIALOGUE itself is a
  # GitHub-only package (livnatje/DIALOGUE) with no conda/CRAN release, so it is
  # installed at a pinned commit in the Dockerfile's cpu stage. Its Depends: are
  # provisioned here from conda-forge so they are ABI-matched to r-base and
  # pinned by the env solve. The one Depends: not on conda-forge (unikn) is
  # source-installed next to DIALOGUE from a date-pinned CRAN snapshot. Without
  # this block library(DIALOGUE) fails to load and the stage silently skips.
  - r-lme4
  - r-lmertest
  - r-pma
  - r-plyr
  - r-matrixstats
  - r-psych
  - r-stringi
  - r-rcolorbrewer
  - r-reshape2
  - r-ppcor
  - r-hmisc
  - r-beanplot
  - r-upsetr

  # NOTE: the editable install of CellQuorum is done in a dedicated Dockerfile
  # RUN step (after the source is copied), NOT here. At env-create time conda
  # resolves a pip local path relative to this file's dir (/tmp in the image),
  # where no package exists; and micromamba's env-file pip handler treats list
  # items as requirements. All of CellQuorum's runtime deps are conda-provided
  # above, so the editable install only registers the package itself.
