name: cellquorum-core

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python runtime.
  - python=3.12
  - pip

  # Core numerical and statistical stack.
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - numba>=0.59

  # Single-cell data structures and analysis.
  - anndata>=0.11
  - scanpy>=1.10
  - h5py>=3.10
  - zarr>=2.17
  - natsort>=8.4

  # Neighbor graphs, dimensionality reduction, and clustering.
  - umap-learn>=0.5
  - pynndescent>=0.5
  - python-igraph>=0.11
  - leidenalg>=0.10
  - louvain>=0.8

  # HVG and preprocessing support.
  - scikit-misc>=0.3

  # CellRank sparse Schur solver (SLEPc/PETSc), as CONDA packages — building
  # these from pip is fragile (PETSc configures + compiles from source). Without
  # them, CellRank's GPCCA Schur decomposition silently falls back to the dense
  # 'brandts' method, which materializes the full n_obs x n_obs transition matrix
  # (~42 GB at 72k cells) and OOM-kills the whole pipeline. With them, CellRank
  # uses the sparse 'krylov' method: identical partial real Schur decomposition,
  # ~1000x less memory. conda-forge ships abi3 wheels compatible with py3.10+.
  # trajectory/_cellrank.py auto-detects them and selects the solver accordingly.
  - petsc4py>=3.22
  - slepc4py>=3.22

  # Batch correction and CPU integration.
  - harmonypy>=0.0.10
  - bbknn>=1.6

  # Doublet/QC support.
  - scrublet>=0.2

  # Biological activity and molecular inference.
  - decoupler-py>=1.8

  # Network/statistical utilities.
  - networkx>=3.2
  - joblib>=1.3
  - tqdm>=4.66

  # Plotting and report rendering.
  - matplotlib>=3.8
  - seaborn>=0.13
  - jinja2>=3.1
  - markdown>=3.6

  # File formats and tables.
  - pyarrow>=14
  - fastparquet>=2024.2
  - openpyxl>=3.1

  # Configuration and CLI.
  - pyyaml>=6.0
  - hydra-core>=1.3
  - omegaconf>=2.3
  - pydantic>=2.7
  - typer>=0.12
  - rich>=13.0

  # In-process analysis stacks + local package.
  #
  # Cell-cell communication (liana, tensor-cell2cell) and trajectory
  # (scvelo, cellrank, palantir) run IN the cellquorum process — unlike the
  # isolated R/celloracle/pyscenic backends dispatched as subprocesses. Their
  # heavy libs are imported lazily inside each method's `_run()` and return a
  # MethodSkip when absent, so without them here the shipped image SILENTLY
  # SKIPS every CCC / RNA-velocity / pseudotime stage. Versions are pinned to
  # the validated working set that ran the fibroblast canary end-to-end
  # (tensor_c2c GPU + CellRank trajectory). torch is the CPU-capable build in
  # this env; the cellquorum-gpu env installs the CUDA build.
  - pip:
      # NOTE: the editable install of the repo (`pip install -e .`) is NOT done
      # here — at env-create time the source is not yet copied into the image,
      # and conda resolves a pip local path relative to this file's dir (/tmp in
      # the image), where no package exists. The Dockerfile installs the package
      # editable in a dedicated RUN step after `COPY . /opt/cellquorum`.
      # Cell-cell communication (in-process).
      - liana==1.7.1
      - cell2cell==0.8.4
      - tensorly==0.9.0
      # Trajectory / RNA velocity / potency (in-process).
      - scvelo==0.3.4
      - cellrank==2.2.0
      - palantir==1.4.4
      # Deep generative models (scVI/scArches); pulls torch.
      - scvi-tools==1.4.3
