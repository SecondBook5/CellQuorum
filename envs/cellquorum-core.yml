name: cellquorum-core

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python runtime.
  - python=3.12
  - pip

  # Core numerical and statistical stack.
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - numba>=0.59

  # Single-cell data structures and analysis.
  - anndata>=0.11
  - scanpy>=1.10
  - h5py>=3.10
  - zarr>=2.17
  - natsort>=8.4

  # Neighbor graphs, dimensionality reduction, and clustering.
  - umap-learn>=0.5
  - pynndescent>=0.5
  - python-igraph>=0.11
  - leidenalg>=0.10
  - louvain>=0.8

  # HVG and preprocessing support.
  - scikit-misc>=0.3

  # Batch correction and CPU integration.
  - harmonypy>=0.0.10
  - bbknn>=1.6

  # Doublet/QC support.
  - scrublet>=0.2

  # Biological activity and molecular inference.
  - decoupler-py>=1.8

  # Network/statistical utilities.
  - networkx>=3.2
  - joblib>=1.3
  - tqdm>=4.66

  # Plotting and report rendering.
  - matplotlib>=3.8
  - seaborn>=0.13
  - jinja2>=3.1
  - markdown>=3.6

  # File formats and tables.
  - pyarrow>=14
  - fastparquet>=2024.2
  - openpyxl>=3.1

  # Configuration and CLI.
  - pyyaml>=6.0
  - hydra-core>=1.3
  - omegaconf>=2.3
  - pydantic>=2.7
  - typer>=0.12
  - rich>=13.0

  # Install the local CellQuorum package in editable mode.
  - pip:
      - -e .
