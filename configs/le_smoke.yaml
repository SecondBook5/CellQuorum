# Fast end-to-end smoke test of the LE global pipeline on tiny subsamples.
# Same stages/methods/wiring as configs/le_global.yaml, but: pre-built small
# cohort as input (ambient_correction off), tiny epochs, 1 scArches seed, small
# HVG. Goal: exercise every stage boundary (multi-method integration + multi-
# method annotation + scArches + consensus) in minutes to catch wiring bugs.
project:
  name: le_smoke
  organism: human
  species_id: 9606

paths:
  output_dir: /home/ajbook/projects/cellquorum/runs/le_smoke

input:
  h5ad: /tmp/le_smoke/cohort_small.h5ad
  counts_layer: counts

run:
  random_seed: 1337
  verbose: true

compute:
  backend: gpu

cohort:
  sample_key: sample_id
  donor_key: donor_id
  condition_key: condition
  batch_key: batch

stages:
  ambient_correction: false     # input is the already-corrected small cohort
  qc: true
  preprocessing: true
  feature_selection: false
  dimensionality: true
  integration: true
  clustering: true
  annotation: true
  reference_mapping: true
  annotation_consensus: true
  annotation_diagnostics: true
  adjudication: true
  population_identity: true
  integration_benchmark: true
  subclustering: false
  state_scoring: false
  discovery: false
  composition: false
  differential_expression: false
  molecular_inference: false
  cell_cell_communication: false
  network_analysis: false

qc:
  enabled: true
  mode: flag_no_drop
  threshold_strategy: fixed_and_mad
  metrics:
    layer: counts
  mad:
    enabled: true
    n_mads: 5.0
    mito_n_mads: 3.0
    groupby: [sample_id]
  basic:
    min_genes_per_cell: 100
    min_cells_per_gene: 1
    max_mito_percent: 30.0
  doublets:
    enabled: true
    methods: [scrublet, scdblfinder]
    consensus: all
    remove: true
    per_sample: true
  cell_cycle:
    enabled: false               # scored post-normalization (export), not in QC
  ambient:
    enabled: false

preprocessing:
  normalization:
    output_layer: cellquorum_normalized

dimensionality:
  enabled: true
  input_layer: cellquorum_normalized
  n_pcs: auto
  max_pcs: 20

integration:
  enabled: true
  batch_key: batch
  methods:
    - method: harmony
      output_rep: X_pca_harmony
    - method: scvi
      output_rep: X_scvi
      n_latent: 10
      max_epochs: 20             # tiny — smoke only

clustering:
  enabled: true
  method: leiden
  use_rep: X_scvi

annotation:
  enabled: true
  cluster_key: leiden
  score_layer: cellquorum_normalized
  counts_layer: counts
  methods:
    - method: marker_vote
      key_added: cell_type_markers
    - method: celltypist
      key_added: cell_type_celltypist
      model: Adult_Human_Skin.pkl
      majority_voting: true
  marker_panels:
    Keratinocytes: [KRT5, KRT14, KRT1, KRT10, KRT15, KRT6A]
    Cornified keratinocytes: [FLG, LOR, SPRR2B, CDSN, IVL]
    Fibroblasts: [COL1A1, COL1A2, COL3A1, DCN, LUM, PDGFRA]
    Pericyte/SMC: [ACTA2, RGS5, PDGFRB, MYH11, TAGLN]
    VEC: [PECAM1, VWF, CLDN5, CDH5, SELE]
    LEC: [LYVE1, PROX1, PDPN, CCL21, FLT4]
    Melanocytes: [MLANA, PMEL, TYR, DCT, MITF]
    Schwann: [SOX10, PLP1, S100B, MPZ, NRXN1]
    DC: [CD1C, CLEC9A, LAMP3, ITGAX, HLA-DRA]
    Macrophages: [CD68, CD163, LYZ, C1QA, C1QB, MRC1]
    Neutrophils: [FCGR3B, CSF3R, S100A8, S100A9, CXCR2]
    Mast: [TPSAB1, TPSB2, CPA3, MS4A2, KIT]
    B cells: [MS4A1, CD79A, CD79B, CD19, BANK1]
    Plasma: [MZB1, IGHG1, JCHAIN, XBP1, DERL3]
    T/NK: [CD3D, CD3E, CD8A, IL7R, NKG7, GNLY]
    Sweat gland: [DCD, MUCL1, SCGB2A2, KRT7, AQP5]

reference_mapping:
  enabled: true
  method: scarches
  compute_backend: gpu
  resume: false
  atlas_h5ad: /tmp/le_smoke/atlas_small.h5ad
  label_key: Cell_type
  atlas_batch_key: biosample_id
  counts_layer: counts
  n_top_genes: 500
  max_epochs_scvi: 20
  max_epochs_scanvi: 10
  max_epochs_query: 20
  seeds: [0]
  key_added: ref_state

annotation_consensus:
  enabled: true
  method_label_keys: [cell_type_markers, cell_type_celltypist, ref_state]
  key_added: cell_type
  confidence_key: annotation_confidence
  needs_review_key: needs_review
  granular_source_key: ref_state
  min_agree_fraction: 0.5
  backbone_aliases:
    Differentiated_KC: Keratinocytes
    Undifferentiated_KC: Keratinocytes
    F1: Fibroblasts
    F2: Fibroblasts
    F3: Fibroblasts
    VE1: VEC
    VE2: VEC
    VE3: VEC
    LE1: LEC
    LE2: LEC
    Pericyte_1: Pericyte/SMC
    Pericyte_2: Pericyte/SMC
    Schwann_1: Schwann
    Schwann_2: Schwann
    Melanocyte: Melanocytes
    Mast_cell: Mast
    Plasma: Plasma
    DC1: DC
    DC2: DC
    MigDC: DC
    migLC: DC
    moDC: DC
    LC: DC
    Inf_mac: Macrophages
    Macro_1: Macrophages
    Macro_2: Macrophages
    Mono_mac: Macrophages
    Tc: T/NK
    Th: T/NK
    Treg: T/NK
    NK: T/NK
    ILC1_3: T/NK
    ILC1_NK: T/NK
    ILC2: T/NK

annotation_diagnostics:
  enabled: true
  method: scdiagnostics
  cell_type_col: cell_type
  expression_layer: cellquorum_normalized

adjudication:
  enabled: true
  cluster_key: leiden
  donor_key: donor_id
  condition_key: condition

population_identity:
  enabled: true
  reference_keys: [ref_state]
  annotation_keys: [cell_type]
  cluster_key: leiden
  sample_key: sample_id
  donor_key: donor_id
  condition_key: condition

integration_benchmark:
  enabled: true
  batch_key: batch
  label_key: cell_type
  pre_embedding: X_pca
  embeddings: [X_pca_harmony, X_scvi]
