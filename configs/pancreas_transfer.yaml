project:
  name: pancreas_transfer
  organism: human
paths:
  output_dir: runs/pancreas_transfer
input:
  h5ad: query.h5ad
run:
  profile: publication
  random_seed: 42
  require_selected_methods: true
stages:
  ambient_correction: false
  qc_splice_metrics: false
  qc_evidence: false
  preprocessing: true
  feature_selection: true
  dimensionality: true
  integration: false
  integration_benchmark: false
  clustering: false
  annotation: false
  annotation_diagnostics: true
  annotation_consensus: false
  annotation_viz: false
  reference_mapping: true
  population_identity: false
  state_scoring: false
  state_scoring_viz: false
  discovery: false
  subclustering: false
  query_projection: false
  qc_finalization: false
  adjudication: false
  metacells: false
  composition: false
  differential_expression: false
  differential_state: false
  coexpression: false
  grn: false
  perturbation: false
  differential_abundance: false
  enrichment: false
  enrichment_viz: false
  de_viz: false
  ccc_viz: false
  embeddings: false
  trajectory: false
  trajectory_viz: false
  cell_cell_communication: false
  network_analysis: false
  multicellular_programs: false
  module_remodeling: false
compute:
  n_jobs: 2
  backend: cpu
  prefer_gpu: false
report:
  fail_on_report_error: true
reference_mapping:
  enabled: true
  atlas_h5ad: reference.h5ad
  label_key: cell_type
  atlas_batch_key: batch
  counts_layer: counts
  key_added: transferred_type
  n_top_genes: 800
  n_latent: 15
  seeds:
  - 42
  max_epochs_scvi: 60
  max_epochs_scanvi: 30
  max_epochs_query: 35
  compute_backend: gpu
preprocessing:
  normalization:
    recipe: cellquorum_log1p_cp10k_v1
    preserve_counts_layer: counts
    output_layer: cellquorum_normalized
feature_selection:
  counts_layer: counts
  n_top_genes: 800
dimensionality:
  input_layer: cellquorum_normalized
  n_pcs: 30
annotation_diagnostics:
  enabled: true
  cell_type_col: transferred_type
  expression_layer: cellquorum_normalized
  soft_scores_obsm: transferred_type_probabilities
