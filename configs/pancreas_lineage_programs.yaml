project:
  name: pancreas_lineage_programs
  organism: mouse
  species_id: 10090
paths:
  output_dir: runs/pancreas_lineage_programs
input:
  h5ad: ${oc.env:CELLQUORUM_PANCREAS_INPUT,endocrinogenesis.h5ad}
run:
  profile: trajectory
  random_seed: 42
  study_questions:
  - lineage
  lineage_rationale: Ductal epithelium precedes endocrine progenitors in the published
    pancreatic developmental hierarchy.
  require_selected_methods: true
  continue_on_stage_failure: true
stages:
  ambient_correction: false
  qc_splice_metrics: false
  qc_evidence: false
  preprocessing: true
  feature_selection: false
  dimensionality: false
  integration: false
  integration_benchmark: false
  clustering: false
  annotation: false
  annotation_diagnostics: false
  annotation_consensus: false
  annotation_viz: false
  reference_mapping: false
  population_identity: false
  state_scoring: false
  state_scoring_viz: false
  discovery: false
  subclustering: false
  query_projection: false
  qc_finalization: false
  adjudication: false
  metacells: false
  composition: false
  differential_expression: false
  differential_state: false
  coexpression: false
  grn: false
  perturbation: false
  differential_abundance: false
  enrichment: false
  enrichment_viz: false
  de_viz: false
  ccc_viz: false
  embeddings: false
  trajectory: true
  trajectory_viz: true
  cell_cell_communication: false
  network_analysis: false
  multicellular_programs: false
  module_remodeling: false
compute:
  n_jobs: 2
  backend: cpu
  prefer_gpu: false
trajectory:
  methods:
  - method: palantir
  - method: velocity
  - method: cellrank
  - method: cytotrace
  dpt:
    root_key: clusters
    root_group: Ductal
    use_rep: X_pca
  velocity:
    grouping_col: clusters_coarse
    mode: stochastic
    whole_object: true
    seed: 42
  palantir:
    root_key: clusters
    root_group: Ductal
    use_rep: X_pca
    seed: 42
  cellrank:
    pseudotime_key: palantir_pseudotime
    cluster_key: clusters
    use_rep: X_pca
    n_states: 6
    n_terminal_states: 3
  cytotrace:
    species: mouse
    counts_layer: spliced
    seed: 42
    disable_parallelization: true
trajectory_viz:
  methods:
  - method: pseudotime_heatmap
  - method: velocity_viz
  - method: gene_trend_viz
    # Continuous log-normalized expression includes zeros.
    gene_trend_layer: cellquorum_normalized
    gam_distribution: gaussian
    gam_link: identity
  - method: activity_cascade
    gmt_path: mh.all.v2025.1.Mm.symbols.gmt
    organism: mouse
    layer: cellquorum_normalized
  pseudotime_keys:
  - palantir_pseudotime
  genes:
  - Neurog3
  - Ins1
  - Gcg
  - Sst
  cluster_key: clusters
  activity_resources:
  - hallmark
report:
  fail_on_report_error: true
preprocessing:
  normalization:
    recipe: cellquorum_log1p_cp10k_v1
    input_layer: spliced
    output_layer: cellquorum_normalized
    preserve_counts_layer: counts
