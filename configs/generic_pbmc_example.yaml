# Start a whole-cell study with QC, normalization, Harmony, clustering, and UMAP.
# Supply your count matrix and edit the cohort keys to match its obs columns.

project:
  name: generic_pbmc_example
  organism: human
  species_id: 9606

input:
  h5ad: /path/to/your_data.h5ad
  counts_layer: counts

run:
  random_seed: 7
  verbose: true

compute:
  backend: cpu            # portable: never requires CUDA/RAPIDS
  prefer_gpu: false

r:
  enabled: false

# --- Central cohort schema: declare structural keys ONCE ---
cohort:
  sample_key: sample_id
  donor_key: donor_id
  condition_key: stim         # e.g. "control" vs "stimulated"
  batch_key: batch
  condition_levels: [control, stimulated]

# The design block declares the primary comparison for future DE/DA stages.
design:
  donor_col: donor_id
  condition_col: stim
  case: stimulated
  control: control
  paired: false

# --- Which stages run ---
stages:
  ambient_correction: false
  qc_splice_metrics: false
  qc_evidence: true
  preprocessing: true
  feature_selection: true
  dimensionality: true
  integration: true          # Harmony over cohort.batch_key
  clustering: true
  annotation: false
  subclustering: false
  adjudication: false
  reference_mapping: false   # no atlas in this generic example
  annotation_diagnostics: false
  annotation_consensus: false
  annotation_viz: false
  query_projection: false
  qc_finalization: false
  metacells: false
  population_identity: true  # falls back to clusters when no reference labels
  integration_benchmark: false
  state_scoring: false
  state_scoring_viz: false
  discovery: false
  composition: false
  differential_expression: false
  differential_state: false
  differential_abundance: false
  enrichment: false
  enrichment_viz: false
  de_viz: false
  coexpression: false
  grn: false
  perturbation: false
  embeddings: true
  trajectory: false
  trajectory_viz: false
  cell_cell_communication: false
  network_analysis: false
  multicellular_programs: false
  ccc_viz: false
  module_remodeling: false

qc_evidence:
  enabled: true
  metrics:
    layer: counts
  doublets:
    enabled: false
  ambient:
    enabled: false
  graded:
    archetype_audit: false

preprocessing:
  normalization:
    recipe: cellquorum_log1p_cp10k_v1
    output_layer: cellquorum_normalized

dimensionality:
  enabled: true
  input_layer: cellquorum_normalized
  n_pcs: auto

integration:
  enabled: true
  method: harmony
  # batch_key intentionally omitted here: resolved from cohort.batch_key.

clustering:
  enabled: true
  method: leiden
  use_rep: X_pca_harmony

embeddings:
  embeddings: [umap]
  methods: [{method: umap}, {method: paga}, {method: categorical_embedding}]

population_identity:
  enabled: true
  cluster_key: leiden
  # sample/donor/condition keys resolved from the cohort block.
  output_dir: population_identity
  write_figures: false

report:
  enabled: true
  html: true
  markdown: true
