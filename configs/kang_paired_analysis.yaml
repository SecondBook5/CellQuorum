# End-to-end human PBMC analysis. Download the two inputs listed in
# docs/guide/paired-study.md, then run this file from the study directory.
project:
  name: kang_paired_analysis
  organism: human
  species_id: 9606
paths:
  output_dir: runs/kang_paired_analysis
input:
  h5ad: data/kang_2018.h5ad
run:
  profile: publication
  study_questions: [populations, differences]
  sensitivity_analysis: true
  require_selected_methods: true
  random_seed: 42
  disabled_stage_reasons:
    ambient_correction: The input contains filtered cells. The recipe has no empty-droplet matrix from the original libraries.
    qc_splice_metrics: Spliced and unspliced count layers are absent from this input.
    integration: &integration No technical batch correction is specified. The paired expression model accounts for donor and retains the stimulation contrast.
    integration_benchmark: *integration
    query_projection: &reference This recipe supplies no external reference atlas or fitted reference model.
    reference_mapping: *reference
    annotation_diagnostics: The reference-based confidence analysis was not selected. This run examines marker expression and agreement with the published labels.
    annotation_consensus: &labels The published cell types define the comparison. The marker-based labels are retained separately for inspection.
    adjudication: *labels
    qc_finalization: This recipe uses the initial QC eligibility decisions and supplies no reference projection for borderline-cell rescue.
    metacells: No metacell analysis was requested. The expression model aggregates raw counts by donor, condition and cell type.
    subclustering: The question compares the eight published populations. No lineage was selected for a separate subcluster analysis.
    discovery: A de novo program discovery analysis is possible on these counts and has not been tested in this recipe.
    coexpression: &regulatory Coexpression modules and regulatory network inference are separate analyses that this paired benchmark does not test.
    grn: *regulatory
    perturbation: No gene knockout or perturbation target was specified for simulation.
    trajectory: &trajectory These samples compare two treatment conditions. No lineage, root or time series is specified for trajectory inference.
    trajectory_viz: *trajectory
    cell_cell_communication: &communication Ligand–receptor inference is a separate question. This recipe specifies no per-library communication analysis.
    ccc_network: *communication
    ccc_viz: *communication
    multicellular_programs: No joint program model across cell populations was selected for this study.
    module_remodeling: The recipe reports paired donor tests of curated state scores. The separate module-remodeling models and depth audit have not been validated in this run.
  required_outputs:
    annotation_viz:
      - figures/annotation/marker_dotplot.pdf
      - results/annotation/marker_dotplot_mean.csv
      - results/annotation/marker_dotplot_pct.csv
    population_identity:
      - results/population_identity/tables/population_summary.csv
      - results/population_identity/tables/population_by_annotation.csv
    state_scoring:
      - results/state_scoring_score_genes_by_celltype.csv
      - results/state_scoring_aucell_by_celltype.csv
    state_scoring_viz: [figures/state_scoring/state_score_violin_aucell_interferon_isg.pdf]
    differential_state: [results/differential_state_results.csv]
    embeddings: [figures/embeddings/categorical_umap_cell_type.pdf]
    composition: [figures/composition/composition_by_patient.pdf]
    differential_abundance:
      - results/da_proportion_ttest.csv
      - figures/differential_abundance/composition_per_patient_stacked.pdf
    differential_expression:
      - results/de_pseudobulk_edger.csv
      - results/de_pseudobulk_edger_by_subcluster.csv
    de_viz:
      - figures/differential_expression/volcano.pdf
      - figures/differential_expression/de_heatmap.pdf
    enrichment:
      - results/enrichment_gsea_hallmark.csv
      - results/enrichment_gsea_hallmark_by_cell_type.csv
      - results/enrichment_gsea_runningES_hallmark.csv
    enrichment_viz:
      - figures/enrichment/gsea_diverging_hallmark.pdf
      - figures/enrichment/gsea_nes_heatmap_hallmark.pdf
compute:
  backend: cpu
  prefer_gpu: false
r:
  enabled: true
cohort:
  donor_key: replicate
  condition_key: label
  condition_levels: [ctrl, stim]
design:
  donor_col: replicate
  condition_col: label
  control: ctrl
  case: stim
  paired: true
stages:
  ambient_correction: false
  qc_splice_metrics: false
  qc_evidence: true
  preprocessing: true
  feature_selection: true
  dimensionality: true
  integration: false
  integration_benchmark: false
  clustering: true
  annotation: true
  annotation_diagnostics: false
  annotation_consensus: false
  annotation_viz: true
  reference_mapping: false
  population_identity: true
  state_scoring: true
  state_scoring_viz: true
  discovery: false
  subclustering: false
  query_projection: false
  qc_finalization: false
  adjudication: false
  metacells: false
  composition: true
  differential_expression: true
  differential_state: true
  coexpression: false
  grn: false
  perturbation: false
  differential_abundance: true
  enrichment: true
  enrichment_viz: true
  de_viz: true
  ccc_viz: false
  embeddings: true
  trajectory: false
  trajectory_viz: false
  cell_cell_communication: false
  network_analysis: false
  multicellular_programs: false
  module_remodeling: false
qc_evidence:
  graded: {archetype_audit: false}
  doublets: {enabled: false}
  ambient: {enabled: false}
preprocessing:
  normalization:
    recipe: cellquorum_log1p_cp10k_v1
    preserve_counts_layer: counts
    output_layer: cellquorum_normalized
feature_selection: {counts_layer: counts}
dimensionality: {input_layer: cellquorum_normalized, n_pcs: 30}
clustering: {use_rep: X_pca, method: leiden}
embeddings:
  use_rep: X_pca
  embeddings: [umap]
  methods: [{method: umap}, {method: paga}, {method: categorical_embedding}]
  color_by: [cell_type, label, leiden]
  figure_formats: [pdf, png]
# Canonical human PBMC markers adapted from the Seurat PBMC tutorials.
annotation:
  method: marker_vote
  lymphocyte_refinement: human_pbmc_v1
  key_added: marker_vote_label
  cluster_key: leiden
  random_state: 42
  marker_panels:
    B cells: [MS4A1, CD79A, CD79B]
    CD4 T cells: [IL7R, CCR7, LTB]
    CD8 T cells: [CD8A, CD8B, CCL5]
    NK cells: [GNLY, NKG7, KLRD1]
    CD14+ Monocytes: [CD14, S100A8, S100A9]
    FCGR3A+ Monocytes: [FCGR3A, MS4A7, VMO1]
    Dendritic cells: [FCER1A, CD1C, CST3]
    Megakaryocytes: [PPBP, PF4, GNG11]
annotation_viz:
  group_by: cell_type
  title: PBMC markers by published cell type
  methods: [{method: marker_dotplot}]
population_identity:
  candidate_key: cell_type
  annotation_keys: [marker_vote_label, cell_type]
  embedding_keys: [X_pca]
state_scoring:
  methods: [{method: score_genes}, {method: aucell}]
  builtin_programs: [interferon_isg, stress_hsp, hypoxia_hif]
  random_state: 42
state_scoring_viz:
  score_source: aucell
  cluster_key: cell_type
  programs: [interferon_isg, stress_hsp, hypoxia_hif]
differential_state:
  obs_columns: [state_interferon_isg, state_stress_hsp, state_hypoxia_hif]
  paired: true
composition: {cell_type_key: cell_type}
differential_abundance:
  methods: [{method: proportion_ttest}]
  cell_type_col: cell_type
differential_expression:
  method: pseudobulk_edger
  layer: counts
  cell_type_col: cell_type
de_viz:
  top_n_labels: 12
  methods:
    - {method: volcano_viz}
    - {method: volcano_by_subcluster, cell_type_col: cell_type}
    - {method: de_heatmap, cell_type_col: cell_type, condition_col: label}
enrichment:
  methods: [{method: gsea}, {method: gsea_by_cell_type}]
  gene_set_collections: [hallmark]
  gmt_path: data/h.all.v2025.1.Hs.symbols.gmt
  gsea_permutations: 1000
  seed: 42
enrichment_viz:
  collections: [hallmark]
  methods: [{method: gsea_viz}, {method: gsea_nes_heatmap}]
report:
  enabled: true
  html: true
  markdown: true
  fail_on_report_error: true
