# le_global_clean_da_artifact_kept — the SENSITIVITY CONTROL for the atlas
# abundance analysis. Identical to `le_global_clean_da.yaml` in every respect
# except one: the audited ambient-debris cluster is NOT excluded.
#
# Why it exists. The main run drops 7,175 cells (leiden 22: shallow, unassignable,
# all thirteen lineages at once, 77% from one library, 93% Lymphedema). Dropping
# cells that are 93% one arm necessarily moves every lineage proportion, so the
# claim "LEC expands" has to be shown to be a property of the tissue and not of
# the cut. The only way to show that is to run the same test both ways and report
# both numbers.
#
# Deliberately NOT a re-run of everything. Only the two per-lineage proportion
# tests run here (propeller and the paired arcsine-sqrt t-test), because those are
# the ones whose unit — a lineage's share of a sample — is directly rescaled by
# removing cells. Milo would take another ~15 minutes to rebuild a 185k-cell
# neighbourhood graph, and scCODA's answer depends on its chosen reference, which
# is itself re-selected when the composition changes; neither comparison would be
# reading the same quantity twice.
#
# The comparison is drawn by `le_shared/scripts/atlas_composition.py`, which reads
# both runs' `da_proportion_ttest.csv` and reports the FDR each lineage reaches
# under each treatment.

project:
  name: le_global_clean_da_artifact_kept
  organism: human
  species_id: 9606

paths:
  output_dir: /home/ajbook/projects/cellquorum/runs/le_global_clean_da_artifact_kept
  data_root: /mnt/e/lymphedema_cellranger

input:
  # The clean atlas: QC applied once, globally, deleting; embedding/clustering
  # recomputed on the surviving cells; scArches labels inherited.
  h5ad: /home/ajbook/projects/cellquorum/runs/le_global_clean/objects/le_global_clean.h5ad
  counts_layer: counts
  # NO `exclude:` block. That single absence is the whole point of this config.

run:
  random_seed: 1337
  verbose: true
  checkpoint: true

compute:
  # No GPU stage runs here: Milo/propeller are R, scCODA and the paired t-test are
  # CPU. Nothing in this run touches a neighbour-graph recomputation.
  backend: cpu
  prefer_gpu: false

cohort:
  sample_key: sample_id
  donor_key: donor_id
  condition_key: condition
  batch_key: batch

# All nine donors contributed both a lymphedematous and an unaffected sample, so
# the design is matched and `paired: true` is a property of the cohort rather than
# a preference. Running it unpaired leaves donor baseline variance in the residual,
# which on this project has already turned real effects into nulls once.
design:
  donor_col: donor_id
  condition_col: condition
  case: Lymphedema
  control: Normal
  paired: true

stages:
  # Nothing is recomputed. The input already carries QC-filtered cells, a
  # normalized layer, PCA, Harmony/scVI integration, clustering, UMAP and labels;
  # re-running any of it here would produce a second version of the atlas that
  # disagrees with the one every other figure is drawn from.
  ambient_correction: false
  qc: false
  preprocessing: false
  feature_selection: false
  dimensionality: false
  integration: false
  clustering: false
  embeddings: false
  annotation: false
  reference_mapping: false
  annotation_consensus: false
  annotation_diagnostics: false
  adjudication: false
  population_identity: false
  integration_benchmark: false
  subclustering: false
  state_scoring: false
  discovery: false
  composition: false
  differential_expression: false
  molecular_inference: false
  cell_cell_communication: false
  network_analysis: false
  coexpression: false
  grn: false
  perturbation: false
  # The one thing this run produces.
  differential_abundance: true
  enrichment: false
  enrichment_viz: false
  de_viz: false
  ccc_viz: false
  trajectory: false
  trajectory_viz: false
  multicellular_programs: false
  module_remodeling: false

differential_abundance:
  enabled: true
  # Two methods, not the main run's four. The quantity under test here is "a
  # lineage's share of a sample", which is what removing 7,175 cells rescales
  # directly, and propeller and the paired arcsine-sqrt t-test are the two methods
  # whose unit that is. Milo's unit is a neighbourhood of a graph that would have
  # to be rebuilt (~15 min) and would not be the same graph; scCODA's is a ratio to
  # a reference cell type that the engine re-selects when the composition changes.
  # Comparing either of those across the two treatments would compare two different
  # quantities and read as a sensitivity result.
  methods:
    - method: propeller
    - method: proportion_ttest
  cell_type_col: cell_type
  # Unused by the two methods that run here, but left identical to the main run so
  # that a diff of the two configs shows exactly one difference: the exclusion.
  use_rep: X_pca_harmony
  k: 30
  prop: 0.1
  spatial_fdr: 0.1
  # Let the engine pick the compositional reference on centred-log-ratio variance
  # rather than scCODA's own criterion, which ranks cell types largely by rarity —
  # and the reference is the denominator of every effect it reports.
  select_reference: true
  min_reference_abundance: 0.05
  pair_by_donor: always
  seed: 1337
  # 185k cells is a bigger graph than the default budget assumes; miloR's
  # buildGraph/makeNhoods pass over it is the long step.
  timeout_seconds: 10800
