# GitHub checks for updates monthly and opens pull requests for review.
# The pip check covers development tools and Python pins used for CI and figure
# generation, including NumPy and pandas. Conda locks are managed via `make lock`.
version: 2

updates:
  # Group related development tools. Other Python updates can get individual PRs.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      study-data-libraries:
        patterns:
          - pandas
          - anndata
      # One PR for the lint/format/type toolchain. A ruff bump often reformats many
      # files; keeping it grouped and separate from test tooling makes the churn
      # reviewable in isolation.
      lint-and-types:
        patterns:
          - ruff
          - mypy
          - types-*
          - pre-commit
      # One PR for test tooling.
      test-tooling:
        patterns:
          - pytest
          - pytest-*
      # One PR for the docs site.
      docs:
        patterns:
          - mkdocs*
          - mkdocstrings*

  # GitHub Actions used by the CI and release workflows. Pinned action versions go
  # stale silently and are a supply-chain surface, so these get watched too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
