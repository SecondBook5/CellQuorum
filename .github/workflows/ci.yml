name: CI

on:
  push:
  pull_request:
  workflow_call:

# Cancel superseded runs on the same ref. Pushing three times to a PR should not
# leave three full matrices running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  environment-locks:
    name: CPU and GPU lock integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.0.2 PyYAML packaging
      - run: python -m pytest tests/repo/test_environment_locks.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The ruff version is declared in three places that must agree: this workflow,
      # the [dev] extra in pyproject.toml, and the ruff-pre-commit rev in
      # .pre-commit-config.yaml. When they drift, local and CI enforce different
      # rules and nobody notices until a "clean" branch fails CI. Derive the version
      # from pyproject and assert the other two match, so the pin can only be
      # changed in lockstep.
      - name: Resolve and cross-check the pinned ruff version
        id: ruff
        run: |
          version=$(python -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          print(re.search(r'\"ruff==([0-9.]+)\"', text).group(1))
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject [dev] pins ruff==$version"

          if ! grep -q "rev: v$version" .pre-commit-config.yaml; then
            echo "::error::.pre-commit-config.yaml ruff rev does not match pyproject's ruff==$version"
            grep -n -A1 'ruff-pre-commit' .pre-commit-config.yaml
            exit 1
          fi
          echo "pre-commit rev matches"

      - name: Install ruff
        run: pip install "ruff==${{ steps.ruff.outputs.version }}"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Check maintained scripts
        run: |
          ruff check scripts
          ruff format --check scripts

  lineage-install:
    name: Clean lineage install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the lineage extra in a fresh environment
        run: |
          python -m venv /tmp/lineage
          /tmp/lineage/bin/pip install '.[lineage]' -c envs/lineage-constraints.txt
          cd /tmp
          lineage/bin/pip check
          lineage/bin/python -I -c "import cellquorum, cellrank, palantir, scvelo, pygam"

  typecheck:
    name: Typecheck (engine spine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: pip install -e .[dev] -c envs/ci-constraints.txt

      # What is checked is the `files` list in [tool.mypy] in pyproject.toml. Widen that list
      # one subpackage at a time; see the ratchet note there.
      - name: mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: pip install -e .[dev] -c envs/ci-constraints.txt

      # The full suite includes the fast tests. Optional backend tests probe availability.
      # -n auto shards across the runner's cores. The suite spends most of its time
      # importing the single-cell stack per worker, so sharding trades some memory
      # for a large wall-clock win.
      # pyproject's fail_under (84) was measured with every optional package installed. This job
      # installs only `.[dev]`, so the tests that need scvi-tools, scvelo, cellrank and the rest skip
      # and their code is uncovered: measured 82.3% here. The floor follows the same rule as
      # pyproject's, two points under what this environment measures.
      - name: Full suite with coverage
        run: pytest -n auto --dist loadfile --cov --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  figures:
    name: Publication figure comparisons
    runs-on: ubuntu-latest
    env:
      CELLQUORUM_CHECK_FIGURE_BASELINES: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reference renderer
        run: |
          pip install -e '.[dev]' -c envs/figure-constraints.txt
          # Optional packages the gallery draws with; pinned in the constraints file.
          pip install -c envs/figure-constraints.txt decoupler pyCirclize POT networkit python-louvain
          # GraphRicciCurvature pins scipy<=1.13.1, which has no wheel for this Python, so it is
          # installed without its dependency pins; its real dependencies are the line above.
          pip install --no-deps GraphRicciCurvature==0.5.3.2
      - name: Compare rendered figures with reviewed references
        run: pytest tests/visualization/test_figure_gallery.py --basetemp=/tmp/figure-comparisons -q
      - name: Upload comparison artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: figure-comparisons
          path: /tmp/figure-comparisons
          if-no-files-found: warn

  snakemake-workflow:
    name: Snakemake workflow (end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with the workflow extra
        run: pip install -e '.[dev,workflow]'
      # Runs the real workflow (generate configs, run the engine, bundle, status matrix) on
      # the synthetic demo project. The plain test job skips this because it does not
      # install snakemake.
      - name: Run the end-to-end workflow test
        run: >
          pytest tests/workflow/test_snakefile_dag.py tests/workflow/test_snakemake_end_to_end.py
          -p no:cacheprovider

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (dev)
        # The docs build imports the package (mkdocstrings API reference), so the
        # package and its docs tooling must both be present.
        run: pip install -e .[dev]
      - name: Build docs (strict)
        # --strict turns broken links and unresolved API references into errors,
        # so documentation drift fails CI instead of shipping silently.
        run: mkdocs build --strict

  build:
    name: Build & verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Verify wheel contents
        shell: python
        run: |
          import tomllib
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          expected = {p.relative_to("src").as_posix() for p in Path("src/cellquorum").rglob("*.R")}
          data_files = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["setuptools"]["data-files"]
          for destination, patterns in data_files.items():
              for pattern in patterns:
                  expected.update(f"{destination}/{p.name}" for p in Path().glob(pattern) if p.suffix == ".R")
          with ZipFile(wheel) as archive:
              bundled = {n.split(".data/data/", 1)[-1] for n in archive.namelist() if n.endswith(".R")}
              assert expected == bundled, f"Missing R scripts {expected - bundled}, extra {bundled - expected}"
              assert "cellquorum/py.typed" in archive.namelist(), "Wheel is missing py.typed"
              assert any(
                  Path(item.filename).name == "LICENSE" and item.file_size > 0
                  for item in archive.infolist()
              ), "Wheel is missing a non-empty LICENSE"
          print(f"Verified {len(expected)} R scripts, py.typed and LICENSE in {wheel.name}")
      - name: Check distribution metadata renders
        # Catches a malformed README or bad metadata that PyPI would reject on
        # upload — cheaper to learn here than at release time.
        run: twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean venv
        # An editable install resolves imports from the source tree, so it cannot
        # catch a packaging mistake. Installing the real wheel can.
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          /tmp/wheelcheck/bin/cellquorum --version
          /tmp/wheelcheck/bin/python -c "import cellquorum; print('import OK', cellquorum.__version__)"

      - name: Run installed-wheel analysis and checkpoint acceptance
        env:
          CELLQUORUM_REQUIRE_WHEEL: "1"
          CELLQUORUM_ACCEPTANCE_BACKEND: "cpu"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: |
          /tmp/wheelcheck/bin/pip install "pytest==9.0.2"
          mkdir -p /tmp/wheelcheck/acceptance
          cp tests/acceptance/*.py /tmp/wheelcheck/acceptance/
          cd /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" acceptance -q --strict-markers
