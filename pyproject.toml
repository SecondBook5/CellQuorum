[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellquorum"
version = "0.1.0"
description = "A publication-grade single-cell RNA-seq workflow engine with Python, R/Bioconductor, and GPU backends."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
authors = [
  { name = "AJ Book" }
]
keywords = [
  "single-cell",
  "scrna-seq",
  "anndata",
  "scanpy",
  "bioinformatics",
  "workflow",
  "bioconductor",
  "rapids",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "anndata>=0.11",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "pandas>=2.1",
  "scipy>=1.11",
  "scanpy>=1.10",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
r = [
  "rpy2>=3.5",
]
gpu = [
  "scvi-tools>=1.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/SecondBook5/cellquorum"
Documentation = "https://github.com/SecondBook5/cellquorum/tree/main/docs"
Issues = "https://github.com/SecondBook5/cellquorum/issues"

[project.scripts]
cellquorum = "cellquorum.cli.app:main"
cq = "cellquorum.cli.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = []
